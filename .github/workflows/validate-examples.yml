name: Validate Examples

on:
  push:
    paths:
      - "examples/**"
      - "references/**"
      - "scripts/validate_specula.py"
      - "tests/**"
      - ".github/workflows/validate-examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - "references/**"
      - "scripts/validate_specula.py"
      - "tests/**"
      - ".github/workflows/validate-examples.yml"
  workflow_dispatch:

jobs:
  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate examples (strict for real, lenient for fictional)
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for dir in examples/*/; do
            const="${dir}constitution.json"
            sm="${dir}state-machine.json"
            [[ -f "$const" && -f "$sm" ]] || continue
            # Real examples (metadata.fictional_example == false) must be warning-free.
            fictional=$(python -c "import json,sys; print(json.load(open('$sm')).get('metadata',{}).get('fictional_example'))")
            strict=""
            if [[ "$fictional" == "False" ]]; then strict="--strict"; fi
            echo "::group::Validating ${dir} (strict=${strict:-no})"
            if ! python scripts/validate_specula.py $strict \
                  --constitution "$const" --state-machine "$sm"; then
              status=1
            fi
            echo "::endgroup::"
          done
          [[ "$status" -eq 0 ]] || { echo "Example validation failed."; exit 1; }
          echo "All examples passed (real examples are warning-free)."

      - name: Run semantic coverage tests
        run: pytest tests/ -q
